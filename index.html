<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV · Cristiano Vendramini — Central Financeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#141210; --bg-2:#1C1813; --bg-3:#241E16;
  --surface:#F7F4EE; --card:#FFFFFF;
  --ink:#1A1610; --muted:#87796A; --muted-2:#B0A08C;
  --line:#E8E1D5; --line-2:#F1ECE2;
  --brass:#B08A45; --brass-d:#8A6B30; --brass-l:#DCC085;
  --teal:#6E4F32; --teal-d:#4C3620;
  --green:#3C7A54; --green-bg:#EAF1EC;
  --red:#A8443E; --red-bg:#F6EAE9;
  --amber:#B0862E; --amber-bg:#F6EEDC;
  --blue:#7A6A50;
  --radius:14px; --radius-s:10px;
  --shadow:0 1px 2px rgba(26,22,16,.05),0 8px 24px -12px rgba(26,22,16,.2);
  --shadow-lg:0 24px 60px -24px rgba(26,22,16,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.15;color:var(--ink);letter-spacing:.1px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}
::selection{background:var(--brass-l)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--bg);color:#E4DAC8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #0B0906}
.brand{padding:22px 22px 18px;border-bottom:1px solid #2A241A;display:flex;align-items:center;gap:13px}
.monogram{width:46px;height:46px;flex:none;position:relative}
.monogram svg{width:100%;height:100%;display:block}
.brand-txt h1{font-size:15px;color:#F7F1E6;letter-spacing:.2px;font-weight:600}
.brand-txt p{font-size:10.5px;color:var(--brass-l);letter-spacing:.7px;text-transform:uppercase;margin-top:2px;font-weight:500}
.nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:#33291A;border-radius:3px}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#7A6E5C;padding:14px 12px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#C9BCA6;font-size:13.5px;font-weight:500;transition:.13s;margin-bottom:1px;position:relative}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.8}
.nav-item:hover{background:#241E14;color:#F3ECDD}
.nav-item.active{background:linear-gradient(90deg,rgba(180,136,77,.16),rgba(180,136,77,.04));color:#F6EEDC}
.nav-item.active svg{opacity:1;color:var(--brass-l)}
.nav-item.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--brass);border-radius:0 3px 3px 0}
.nav-badge{margin-left:auto;background:#33291A;color:#B3A68F;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600;font-family:'IBM Plex Mono'}
.nav-badge.alert{background:rgba(181,80,74,.25);color:#E9A9A4}
.side-foot{padding:12px;border-top:1px solid #2A241A}
.side-foot .who{font-size:11px;color:#8A7C68;padding:4px 8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:9px;background:#241E14;color:#C9BCA6;font-size:12.5px;font-weight:500}
.side-foot button:hover{background:#2E2718;color:#F3ECDD}
.side-foot svg{width:15px;height:15px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(242,244,241,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:20px}
.topbar-titles h2{font-size:20px}.topbar-titles p{font-size:12.5px;color:var(--muted);margin-top:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.cash-chip{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 15px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cash-chip .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.cash-chip .val{font-size:16px;font-weight:600;color:var(--teal-d)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:.14s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--ink);color:#fff}.btn-primary:hover{background:#0B1614;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-brass{background:linear-gradient(140deg,var(--brass),var(--brass-d));color:#fff;box-shadow:0 6px 16px -8px rgba(148,108,51,.7)}
.btn-brass:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(148,108,51,.8)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--brass-l);color:var(--brass-d)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.content{padding:26px 30px 60px;flex:1}
@media(max-width:640px){.content{padding:18px 16px 50px}.topbar{padding:14px 16px}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.kpi .klbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
.kpi .kicon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi .kicon svg{width:16px;height:16px}
.kpi .kval{font-size:24px;font-weight:600;letter-spacing:-.5px}
.kpi .ksub{font-size:12px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:5px}
.tint-brass{background:var(--brass)}.tint-brass svg{color:#fff}
.tint-teal{background:var(--teal)}.tint-teal svg{color:#fff}
.tint-green{background:var(--green-bg)}.tint-green svg{color:var(--green)}
.tint-red{background:var(--red-bg)}.tint-red svg{color:var(--red)}
.tint-amber{background:var(--amber-bg)}.tint-amber svg{color:var(--amber)}
.tint-blue{background:#E7EFF6}.tint-blue svg{color:var(--blue)}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.pill-green{background:var(--green-bg);color:var(--green)}.pill-red{background:var(--red-bg);color:var(--red)}
.pill-amber{background:var(--amber-bg);color:var(--amber)}.pill-teal{background:#E1F0ED;color:var(--teal-d)}
.pill-gray{background:#EDF0EE;color:var(--muted)}.pill-blue{background:#E7EFF6;color:var(--blue)}.pill-brass{background:#F6ECD9;color:var(--brass-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:15px}.card-h .sub{font-size:12px;color:var(--muted)}
.card-h .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:20px}
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:18px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:900px){.grid-2,.grid-2b{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFA}
table.data td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr{transition:.1s}table.data tbody tr:hover{background:#FAFAF8}
table.data td.num{text-align:right;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums}
.row-title{font-weight:600;color:var(--ink)}.row-sub{font-size:11.5px;color:var(--muted)}
.t-actions{display:flex;gap:4px;justify-content:flex-end;opacity:.75}
.icon-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}.icon-btn.del:hover{background:var(--red-bg);color:var(--red)}
.icon-btn svg{width:15px;height:15px}
.avatar{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;font-family:'Space Grotesk'}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.3;margin-bottom:14px}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:5px}
.empty p{font-size:13px;max-width:360px;margin:0 auto 18px}
.overlay{position:fixed;inset:0;background:rgba(14,28,26,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;opacity:0;pointer-events:none;transition:.2s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:600px;box-shadow:var(--shadow-lg);transform:translateY(14px) scale(.98);transition:.22s;overflow:hidden}
.modal.wide{max-width:820px}
.overlay.show .modal{transform:none}
.modal-h{padding:20px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:17px}.modal-h p{font-size:12px;color:var(--muted)}
.modal-h .close{margin-left:auto;width:32px;height:32px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-h .close:hover{background:var(--line-2);color:var(--ink)}
.modal-b{padding:22px 24px;max-height:66vh;overflow-y:auto}
.modal-f{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;background:#FBFCFB}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink)}
.field label .hint{font-weight:400;color:var(--muted);font-size:11px}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);transition:.14s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(180,136,77,.13)}
.field textarea{resize:vertical;min-height:60px}
.field .prefix{position:relative}.field .prefix input{padding-left:34px}
.field .prefix::before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-family:'IBM Plex Mono';font-weight:500;pointer-events:none}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--ink);color:#fff}
.flowbar{display:flex;flex-direction:column}
.flowrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.flowrow:last-child{border-bottom:none}
.flowrow .fl{font-size:13px;color:var(--ink)}.flowrow .fl small{color:var(--muted);font-size:11.5px}
.flowrow .fv{font-family:'IBM Plex Mono';font-weight:600;font-size:14px}
.neg{color:var(--red)}.pos{color:var(--green)}
.alert-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.alert-item .atx{font-size:13px;flex:1}.alert-item .atx small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.mini-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.mini-row:last-child{border-bottom:none}
.chart-box{position:relative;height:250px}
.due-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:'IBM Plex Mono'}
.due-ok{background:var(--green-bg);color:var(--green)}.due-soon{background:var(--amber-bg);color:var(--amber)}.due-late{background:var(--red-bg);color:var(--red)}
.alloc-dot{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.prog{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--brass));transition:.4s}
.prog.over i{background:var(--red)}
.socio-row{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:8px;align-items:center}
.socio-row .rm{width:34px;height:34px;border-radius:8px;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center}
.socio-row .rm svg{width:15px;height:15px}
.add-line{font-size:12.5px;font-weight:600;color:var(--brass-d);display:inline-flex;align-items:center;gap:5px;padding:6px 0}
.add-line svg{width:14px;height:14px}
.checklist{display:flex;flex-direction:column}
.check-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2)}
.check-item:last-child{border-bottom:none}
.check-box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;color:#fff}
.check-box svg{width:14px;height:14px;opacity:0}
.check-box.on{background:var(--green);border-color:var(--green)}.check-box.on svg{opacity:1}
.check-item .cname{font-size:13px;font-weight:500;flex:none;width:160px}
.check-item.done .cname{color:var(--muted)}
.check-item input.cobs{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.25s;display:flex;align-items:center;gap:9px;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:var(--brass-l);flex:none}
.toast.err{background:var(--red)}.toast.err svg{color:#fff}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);gap:12px;font-size:13.5px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mobile-bar{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:262px;z-index:90;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none}
  .mobile-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);color:#fff;position:sticky;top:0;z-index:30}
  .mobile-bar .monogram{width:36px;height:36px}.mobile-bar .monogram span{font-size:15px}
  .mobile-bar h1{font-size:14px;color:#fff}
  .hamb{width:38px;height:38px;border-radius:9px;background:#241E14;display:flex;align-items:center;justify-content:center}
  .hamb svg{width:19px;height:19px;color:#C9BCA6}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:85}.scrim.show{display:block}
  .form-grid{grid-template-columns:1fr}.kpi .kval{font-size:21px}
}
.hide{display:none!important}
body.ro .btn-brass, body.ro .t-actions, body.ro .add-line, body.ro .icon-btn.del{display:none!important}
.ro-badge{background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:600;padding:8px 14px;border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ro-badge svg{width:16px;height:16px}
/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;background:radial-gradient(120% 120% at 50% 0%,#241E16 0%,#1C1813 45%,#141210 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:300}
.login-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;padding:34px 32px}
.login-card .monogram{width:56px;height:56px;margin:0 auto 18px}
.login-card .monogram span{font-size:23px}
.login-card h2{text-align:center;font-size:20px}
.login-card .lsub{text-align:center;color:var(--muted);font-size:12.5px;margin:4px 0 24px;text-transform:uppercase;letter-spacing:.8px}
.login-card .field{margin-bottom:14px}
.login-card .btn{width:100%;justify-content:center;padding:12px}
.login-toggle{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
.login-toggle b{color:var(--brass-d);cursor:pointer}
.login-msg{font-size:12.5px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none}
.login-msg.show{display:block}
.login-msg.error{background:var(--red-bg);color:var(--red)}
.login-msg.ok{background:var(--green-bg);color:var(--green)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="monogram"><svg viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="42" height="42" rx="11" fill="#141210"/><rect x="2.9" y="2.9" width="40.2" height="40.2" rx="10.2" fill="none" stroke="#B08A45" stroke-width="1.5"/><path d="M13 21.5 L23 13 L33 21.5" fill="none" stroke="#DCC085" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="23" y="33.5" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-weight="700" font-size="16" fill="#DCC085" letter-spacing="0.5">CV</text></svg></div>
    <h2>Central Financeira</h2>
    <p class="lsub" id="loginSub">Entrar</p>
    <div class="login-msg" id="loginMsg"></div>
    <div class="field"><label>E-mail</label><input id="li_email" type="email" placeholder="voce@email.com" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input id="li_pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-brass" id="loginBtn" onclick="submitAuth()">Entrar</button>
    <div class="login-toggle" id="loginToggle">Ainda não tem conta? <b onclick="toggleAuthMode()">Criar conta</b></div>
  </div>
</div>

<!-- APP -->
<div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
<div class="app hide" id="appShell">

/* ================= AUTH ================= */
let authMode='login';
function toggleAuthMode(){authMode=authMode==='login'?'signup':'login';
  $('#loginSub').textContent=authMode==='login'?'Entrar':'Criar conta';
  $('#loginBtn').textContent=authMode==='login'?'Entrar':'Criar conta';
  $('#loginToggle').innerHTML=authMode==='login'?'Ainda não tem conta? <b onclick="toggleAuthMode()">Criar conta</b>':'Já tem conta? <b onclick="toggleAuthMode()">Entrar</b>';
  loginMsg('');}
function loginMsg(txt,kind){const m=$('#loginMsg');if(!txt){m.className='login-msg';m.textContent='';return;}m.className='login-msg show '+(kind||'error');m.textContent=txt;}
async function submitAuth(){
  const email=$('#li_email').value.trim(),pass=$('#li_pass').value;
  if(!email||!pass){loginMsg('Preencha e-mail e senha.');return;}
  $('#loginBtn').disabled=true;$('#loginBtn').textContent='Aguarde…';
  try{
    if(authMode==='login'){
      const{error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }else{
      const{data,error}=await SB.auth.signUp({email,password:pass});
      if(error)throw error;
      if(!data.session){loginMsg('Conta criada! Se pedir confirmação por e-mail, confirme e entre. (Dá pra desligar isso no Supabase.)','ok');authMode='login';toggleAuthMode();toggleAuthMode();return;}
    }
  }catch(e){loginMsg(traduzErro(e.message||''));}
  finally{$('#loginBtn').disabled=false;$('#loginBtn').textContent=authMode==='login'?'Entrar':'Criar conta';}
}
function traduzErro(m){
  if(/invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Faça login.';
  if(/password should be/i.test(m))return 'A senha precisa de pelo menos 6 caracteres.';
  if(/email not confirmed/i.test(m))return 'E-mail ainda não confirmado. Confirme pelo link ou desligue a confirmação no Supabase.';
  return m;
}
async function doLogout(){await SB.auth.signOut();}

SB.auth.onAuthStateChange((_e,session)=>{
  if(session){showApp(session);}else{showLogin();}

function showLogin(){$('#loginScreen').classList.remove('hide');$('#appShell').classList.add('hide');}
async function showApp(session){
  $('#loginScreen').classList.add('hide');$('#appShell').classList.remove('hide');
  $('#whoami').textContent=session?.user?.email||'';
  await ensurePerfil(session);
  renderNav();go('painel');
}
async function ensurePerfil(session){
  S.papel='admin';S.readonly=false;S.perfil=null;
  try{
    const uid=session.user.id;
    let{data:perfil}=await SB.from('perfis').select('*').eq('auth_uid',uid).maybeSingle();
    if(!perfil){
      const{count}=await SB.from('perfis').select('*',{count:'exact',head:true});
      const papel=(count||0)===0?'admin':'visualizacao';
      const ins=await SB.from('perfis').insert({auth_uid:uid,nome:session.user.email,papel}).select().single();
      perfil=ins.data;
    }
    if(perfil){S.perfil=perfil;S.papel=perfil.papel||'admin';S.readonly=(S.papel==='visualizacao');}
  }catch(e){/* se perfis indisponível, mantém admin p/ não travar */}
  document.body.classList.toggle('ro',!!S.readonly);
  const w=$('#whoami');if(w&&S.papel)w.textContent=(session?.user?.email||'')+' · '+({admin:'Admin',financeiro:'Financeiro',obra:'Obra',visualizacao:'Somente leitura'}[S.papel]||S.papel);
}

  if(ROUTE==='obraDetail')meta={t:'Obra',sub:'Gastos, sócios, etapas e documentação'};
  $('#pageTitle').textContent=meta.t;$('#pageSub').textContent=meta.sub;
  clearCharts();
  const c=$('#content');
  c.innerHTML=`<div class="loading"><div class="spin"></div> Carregando…</div>`;
  $('#topbarRight').innerHTML='';
  try{
    if(ROUTE==='painel')await renderPainel(c);
    else if(ROUTE==='contas')await renderContas(c);
    else if(ROUTE==='cartoes')await renderCartoes(c);
    else if(ROUTE==='lancamentos')await renderLancamentos(c);
    else if(ROUTE==='extrato')await renderExtrato(c);
    else if(ROUTE==='orcamento')await renderOrcamento(c);
    else if(ROUTE==='pagar')await renderPagar(c);
    else if(ROUTE==='receber')await renderReceber(c);
    else if(ROUTE==='obras')await renderObras(c);
    else if(ROUTE==='obraDetail')await renderObraDetail(c);
    else if(ROUTE==='empreendimentos')await renderEmpreendimentos(c);
    else if(ROUTE==='socios')await renderSocios(c);
    else if(ROUTE==='fornecedores')await renderFornecedores(c);
    else if(ROUTE==='imoveis')await renderImoveis(c);
    else if(ROUTE==='proprietarios')await renderProprietarios(c);
    else if(ROUTE==='leads')await renderLeads(c);
    else if(ROUTE==='visitas')await renderVisitas(c);
    else if(ROUTE==='propostas')await renderPropostas(c);
    else if(ROUTE==='comissoes')await renderComissoes(c);
    else if(ROUTE==='patrimonio')await renderPatrimonio(c);
    else if(ROUTE==='relatorios')await renderRelatorios(c);
    else if(ROUTE==='documentos')await renderDocumentos(c);
    else if(ROUTE==='busca')await renderBusca(c);
    else if(ROUTE==='usuarios')await renderUsuarios(c);
    else if(ROUTE==='auditoria')await renderAuditoria(c);
  }catch(e){
    c.innerHTML=`<div class="empty">${sicon('alert')}<h3>Não consegui carregar</h3><p>${esc(traduzErro(e.message||String(e)))}</p><button class="btn btn-ghost" onclick="render()">Tentar de novo</button></div>`;
  }
}

/* helpers de UI */
function kpiCard(k){return `<div class="kpi"><div class="top"><span class="klbl">${k.lbl}</span><div class="kicon tint-${k.tint||'brass'}">${sicon(k.ic||'wallet')}</div></div><div class="kval mono">${k.val}</div>${k.sub?`<div class="ksub">${k.sub}</div>`:''}</div>`;}
function emptyCard(icon,titulo,texto,btn){return `<div class="card"><div class="empty">${sicon(icon)}<h3>${titulo}</h3><p>${texto}</p>${btn||''}</div></div>`;}
async function reloadContas(){S.contas=await dbList('contas_bancarias');S.saldos=await dbView('v_saldos_contas');}
async function loadBasics(){if(!S.categorias.length)S.categorias=await dbList('categorias','nome');if(!S.contas.length)await reloadContas();await loadEmpresas();}

/* ================= PAINEL ================= */
async function renderPainel(c){
  await reloadContas();
  S.cartoes=await dbList('cartoes');
  S.parcelas=await dbList('parcelas','competencia');
  S.faturas=await dbList('faturas','competencia');
  S.contasPagar=await dbList('contas_pagar','vencimento');
  S.contasReceber=await dbList('contas_receber','vencimento');
  S.fluxo=await dbView('v_fluxo_mensal');

  const saldoTotal=sum(S.saldos,x=>N(x.saldo_atual));
  const aPagar=sum(S.contasPagar.filter(x=>['pendente','agendada','vencida'].includes(x.status)),x=>N(x.valor));
  const aReceber=sum(S.contasReceber.filter(x=>['a_receber','atrasada','prevista'].includes(x.status)),x=>N(x.valor));
  const faturaAberta=sum(S.parcelas.filter(p=>{const f=S.faturas.find(f=>f.id===p.fatura_id);return f&&f.status!=='paga';}),p=>N(p.valor));
  const mes=curMonth();
  const fm=S.fluxo.find(f=>monthKey(f.mes)===mes)||{entradas:0,saidas:0,resultado:0};

  const alerts=[];
  S.contasPagar.filter(x=>['pendente','agendada'].includes(x.status)).forEach(x=>{const d=daysUntil(x.vencimento);
    if(d!==null&&d<=7)alerts.push({lvl:d<0?'red':'amber',txt:`${x.descricao} · ${money0(x.valor)}`,sub:d<0?`venceu há ${-d}d`:d===0?'vence hoje':`vence em ${d}d`});});
  S.faturas.filter(f=>f.status!=='paga'&&f.vencimento).forEach(f=>{const d=daysUntil(f.vencimento);
    if(d!==null&&d<=10)alerts.push({lvl:d<0?'red':'amber',txt:`Fatura ${cartaoNome(f.cartao_id)}`,sub:`vence ${fmtDate(f.vencimento)}`});});

  c.innerHTML=`
    <div class="kpi-grid">
      ${kpiCard({lbl:'Saldo em bancos',val:kmoney(saldoTotal),sub:S.contas.length+' conta(s)',ic:'wallet',tint:'teal'})}
      ${kpiCard({lbl:'A pagar',val:kmoney(aPagar),sub:S.contasPagar.filter(x=>x.status!=='paga').length+' pendente(s)',ic:'pagar',tint:aPagar>0?'red':'green'})}
      ${kpiCard({lbl:'A receber',val:kmoney(aReceber),ic:'receber',tint:'green'})}
      ${kpiCard({lbl:'Faturas em aberto',val:kmoney(faturaAberta),sub:'cartões',ic:'cartoes',tint:'amber'})}
      ${kpiCard({lbl:'Entradas do mês',val:kmoney(fm.entradas),ic:'down',tint:'green'})}
      ${kpiCard({lbl:'Saídas do mês',val:kmoney(fm.saidas),ic:'up',tint:'red'})}
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-h"><h3>Fluxo de caixa mensal</h3><span class="sub">entradas × saídas</span></div>
        <div class="card-b">${S.fluxo.length?`<div class="chart-box"><canvas id="fluxoChart"></canvas></div>`:`<div class="empty" style="padding:30px">${sicon('lancamentos')}<h3 style="font-size:15px">Sem movimento ainda</h3><p>Lance entradas e saídas para ver o fluxo.</p></div>`}</div></div>
      <div class="card"><div class="card-h"><h3>Alertas</h3><div class="actions">${alerts.length?`<span class="pill pill-amber">${alerts.length}</span>`:`<span class="pill pill-green">tudo certo</span>`}</div></div>
        <div class="card-b">${alerts.length?alerts.map(a=>`<div class="alert-item"><span class="alert-dot" style="background:var(--${a.lvl==='red'?'red':'amber'})"></span><div class="atx">${esc(a.txt)}<small>${esc(a.sub)}</small></div></div>`).join(''):`<div class="empty" style="padding:26px">${sicon('check')}<h3 style="font-size:14px">Nenhum alerta</h3><p style="margin-bottom:0">Sem contas ou faturas vencendo nos próximos dias.</p></div>`}</div></div>
    </div>
    <div class="card"><div class="card-h"><h3>Saldo por banco</h3><div class="actions"><button class="btn btn-ghost btn-sm" onclick="go('contas')">Ver contas</button></div></div>
      <div class="tbl-wrap">${S.saldos.length?`<table class="data"><thead><tr><th>Conta</th><th class="num">Saldo atual</th></tr></thead><tbody>
        ${S.saldos.map(s=>`<tr><td><div class="row-title">${esc(s.banco)}</div><div class="row-sub">${esc(s.nome)}</div></td><td class="num"><b class="${N(s.saldo_atual)<0?'neg':''}">${money(s.saldo_atual)}</b></td></tr>`).join('')}
      </tbody></table>`:`<div class="empty">${sicon('contas')}<h3>Nenhuma conta cadastrada</h3><p>Comece cadastrando as contas bancárias do seu pai.</p><button class="btn btn-brass" onclick="go('contas')">${sicon('plus')}Cadastrar conta</button></div>`}</div></div>`;

  if(S.fluxo.length){
    const f=S.fluxo.slice(-8);
    mkChart('fluxoChart',{type:'bar',data:{labels:f.map(x=>fmtMonth(x.mes)),datasets:[
      {label:'Entradas',data:f.map(x=>N(x.entradas)),backgroundColor:'#2E8B62',borderRadius:5,maxBarThickness:22},
      {label:'Saídas',data:f.map(x=>N(x.saidas)),backgroundColor:'#B5504A',borderRadius:5,maxBarThickness:22}]},
      options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,usePointStyle:true,padding:16}},tooltip:{callbacks:{label:x=>x.dataset.label+': '+money0(x.raw)}}},
        scales:{x:{grid:{display:false}},y:{grid:{color:'#EDEFEA'},ticks:{callback:v=>kmoney(v)}}}}});
  }
}

/* ================= CONTAS BANCÁRIAS ================= */
async function renderContas(c){
  await reloadContas();
  $('#topbarRight').innerHTML=`<button class="btn btn-brass" onclick="formConta()">${sicon('plus')}Nova conta</button>`;
  const saldoTotal=sum(S.saldos,x=>N(x.saldo_atual));
  c.innerHTML=`
    <div class="kpi-grid">
      ${kpiCard({lbl:'Saldo total',val:kmoney(saldoTotal),ic:'wallet',tint:'teal'})}
      ${kpiCard({lbl:'Contas ativas',val:S.contas.filter(x=>x.ativo!==false).length,ic:'contas',tint:'brass'})}
    </div>
    <div class="card"><div class="tbl-wrap">${S.contas.length?`<table class="data"><thead><tr><th>Banco / Conta</th><th>Tipo</th><th class="num">Saldo inicial</th><th class="num">Saldo atual</th><th></th></tr></thead><tbody>
      ${S.contas.map(x=>{const sl=S.saldos.find(s=>s.id===x.id);return `<tr>
        <td><div class="row-title">${esc(x.banco)}</div><div class="row-sub">${esc(x.nome)}${x.numero_final?' · final '+esc(x.numero_final):''}</div></td>
        <td>${esc(x.tipo||'—')}</td>
        <td class="num">${money(x.saldo_inicial)}</td>
        <td class="num"><b class="${sl&&N(sl.saldo_atual)<0?'neg':''}">${money(sl?sl.saldo_atual:x.saldo_inicial)}</b></td>
        <td><div class="t-actions"><button class="icon-btn" onclick='formConta(${JSON.stringify(x.id)})'>${sicon('edit')}</button><button class="icon-btn del" onclick='delReg("contas_bancarias","${x.id}","Conta")'>${sicon('trash')}</button></div></td></tr>`;}).join('')}
    </tbody></table>`:`<div class="empty">${sicon('contas')}<h3>Nenhuma conta ainda</h3><p>Cadastre as contas bancárias (e o "caixa/dinheiro" se ele usa). O saldo é calculado sozinho pelos lançamentos.</p><button class="btn btn-brass" onclick="formConta()">${sicon('plus')}Nova conta</button></div>`}</div></div>`;
}
function formConta(id){
  const x=id?S.contas.find(y=>y.id===id):{saldo_inicial:0,tipo:'corrente'};
  openModalK('conta:'+(id||'new'),'Conta bancária',`
    <div class="field full"><label>Banco <span class="hint">*</span></label><input id="m_banco" value="${esc(x.banco||'')}" placeholder="Ex.: Itaú, Nubank, Caixa"></div>
    <div class="field"><label>Nome da conta</label><input id="m_nome" value="${esc(x.nome||'')}" placeholder="Ex.: Conta corrente"></div>
    <div class="field"><label>Tipo</label><select id="m_tipo">${['corrente','poupança','dinheiro/caixa','investimento'].map(t=>`<option ${x.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Saldo inicial</label><div class="prefix"><input id="m_saldo_inicial" type="text" inputmode="decimal" class="moeda" value="${x.saldo_inicial??0}"></div></div>
    <div class="field"><label>Final da conta</label><input id="m_numero_final" value="${esc(x.numero_final||'')}" placeholder="0000"></div>
  `,async()=>{
    const row={banco:val('m_banco'),nome:val('m_nome'),tipo:val('m_tipo'),saldo_inicial:N(val('m_saldo_inicial')),numero_final:val('m_numero_final')};
    if(!row.banco){toast('Informe o banco',1);return false;}
    if(id)await dbUpdate('contas_bancarias',id,row);else await dbInsert('contas_bancarias',row);
    toast('Conta salva');return true;
  });
}

/* ================= CARTÕES + FATURAS ================= */
let cartaoAberto=null;
async function renderCartoes(c){
  await loadBasics();
  S.cartoes=await dbList('cartoes');
  S.faturas=await dbList('faturas','competencia');
  S.parcelas=await dbList('parcelas','competencia');
  $('#topbarRight').innerHTML=`<button class="btn btn-brass" onclick="formCartao()">${sicon('plus')}Novo cartão</button>`;
  if(!S.cartoes.length){c.innerHTML=emptyCard('cartoes','Nenhum cartão','Cadastre os cartões de crédito. Compras no cartão viram parcelas na fatura — e só o pagamento da fatura sai do banco.',`<button class="btn btn-brass" onclick="formCartao()">${sicon('plus')}Novo cartão</button>`);return;}
  c.innerHTML=`<div style="display:grid;gap:14px">${S.cartoes.map(cartaoCard).join('')}</div>`;
}
function cartaoCard(ct){
  const parc=S.parcelas.filter(p=>p.cartao_id===ct.id);
  const abertas=parc.filter(p=>{const f=S.faturas.find(f=>f.id===p.fatura_id);return f&&f.status!=='paga';});
  const usado=sum(abertas,p=>N(p.valor));
  const fats=S.faturas.filter(f=>f.cartao_id===ct.id).sort((a,b)=>(''+a.competencia).localeCompare(''+b.competencia));
  return `<div class="card"><div class="card-h">
      <div class="kicon tint-brass" style="width:40px;height:40px;border-radius:11px">${sicon('cartoes')}</div>
      <div><h3>${esc(ct.nome)}</h3><span class="sub">${esc(ct.bandeira||'')}${ct.final?' · final '+esc(ct.final):''} · limite ${money0(ct.limite)}</span></div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" onclick="formCompraCartao('${ct.id}')">${sicon('plus')}Compra</button>
        <button class="icon-btn" onclick='formCartao("${ct.id}")'>${sicon('edit')}</button>
        <button class="icon-btn del" onclick='delReg("cartoes","${ct.id}","Cartão")'>${sicon('trash')}</button>
      </div></div>
    <div class="card-b">
      <div style="display:flex;gap:22px;margin-bottom:14px;flex-wrap:wrap">
        <div><div class="row-sub">Em aberto (faturas não pagas)</div><div class="mono" style="font-size:19px;font-weight:600">${money(usado)}</div></div>
        <div><div class="row-sub">Limite disponível</div><div class="mono" style="font-size:19px;font-weight:600">${money(N(ct.limite)-usado)}</div></div>
      </div>
      ${fats.length?`<div class="tbl-wrap"><table class="data"><thead><tr><th>Fatura</th><th>Vencimento</th><th class="num">Valor</th><th>Status</th><th></th></tr></thead><tbody>
        ${fats.map(f=>{const tot=sum(S.parcelas.filter(p=>p.fatura_id===f.id),p=>N(p.valor));
          return `<tr><td class="row-title">${fmtMonth(monthKey(f.competencia))}</td>
            <td>${fmtDate(f.vencimento)||'—'}</td>
            <td class="num">${money(tot)}</td>
            <td>${f.status==='paga'?'<span class="pill pill-green">paga</span>':'<span class="pill pill-amber">aberta</span>'}</td>
            <td>${f.status==='paga'?'':`<button class="btn btn-ghost btn-sm" onclick="pagarFatura('${f.id}',${tot})">Pagar fatura</button>`}</td></tr>`;}).join('')}
      </tbody></table></div>`:`<div class="row-sub">Nenhuma compra lançada neste cartão ainda.</div>`}
    </div></div>`;
}
function formCartao(id){
  const x=id?S.cartoes.find(y=>y.id===id):{limite:0};
  openModalK('cartao:'+(id||'new'),'Cartão de crédito',`
    <div class="field full"><label>Nome <span class="hint">*</span></label><input id="m_nome" value="${esc(x.nome||'')}" placeholder="Ex.: Itaú Visa"></div>
    <div class="field"><label>Bandeira</label><input id="m_bandeira" value="${esc(x.bandeira||'')}" placeholder="Visa, Master…"></div>
    <div class="field"><label>Final</label><input id="m_final" value="${esc(x.final||'')}" placeholder="1234"></div>
    <div class="field"><label>Limite</label><div class="prefix"><input id="m_limite" type="text" inputmode="decimal" class="moeda" value="${x.limite??0}"></div></div>
    <div class="field"><label>Vinculado ao banco</label><select id="m_conta_id"><option value="">— nenhum —</option>${S.contas.map(cc=>`<option value="${cc.id}" ${x.conta_id===cc.id?'selected':''}>${esc(cc.banco+' · '+cc.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Dia de fechamento</label><input id="m_dia_fechamento" type="number" min="1" max="31" value="${x.dia_fechamento||''}"></div>
    <div class="field"><label>Dia de vencimento</label><input id="m_dia_vencimento" type="number" min="1" max="31" value="${x.dia_vencimento||''}"></div>
  `,async()=>{
    const row={nome:val('m_nome'),bandeira:val('m_bandeira'),final:val('m_final'),limite:N(val('m_limite')),
      conta_id:val('m_conta_id')||null,dia_fechamento:val('m_dia_fechamento')?N(val('m_dia_fechamento')):null,dia_vencimento:val('m_dia_vencimento')?N(val('m_dia_vencimento')):null};
    if(!row.nome){toast('Informe o nome do cartão',1);return false;}
    if(id)await dbUpdate('cartoes',id,row);else await dbInsert('cartoes',row);
    toast('Cartão salvo');return true;
  });
}
function formCompraCartao(cartaoId){
  const cats=S.categorias.filter(c=>c.tipo==='saida');
  openModalK('compracartao:'+cartaoId,'Compra no cartão',`
    <div class="field full"><label>Descrição <span class="hint">*</span></label><input id="m_descricao" placeholder="Ex.: Material de construção"></div>
    <div class="field"><label>Valor total</label><div class="prefix"><input id="m_valor" type="text" inputmode="decimal" class="moeda" placeholder="0,00"></div></div>
    <div class="field"><label>Parcelas</label><input id="m_parcelas_qtd" type="number" min="1" value="1"></div>
    <div class="field"><label>Data</label><input id="m_data" type="date" value="${today()}"></div>
    <div class="field"><label>Categoria</label><select id="m_categoria_id"><option value="">—</option>${cats.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
  `,async()=>{
    const v=N(val('m_valor'));if(!val('m_descricao')||!v){toast('Descrição e valor são obrigatórios',1);return false;}
    await dbInsert('compras',{descricao:val('m_descricao'),valor:v,forma:'cartao',cartao_id:cartaoId,
      parcelas_qtd:N(val('m_parcelas_qtd'))||1,data:val('m_data'),categoria_id:val('m_categoria_id')||null});
    toast('Compra lançada — parcelas geradas na fatura');return true;
  },'A compra vira parcelas na fatura. O banco só é debitado quando você paga a fatura.');
}
async function pagarFatura(faturaId,total){
  if(!S.contas.length){toast('Cadastre uma conta bancária primeiro',1);return;}
  openModal('Pagar fatura',`
    <div class="field full"><label>Pagar com qual conta? <span class="hint">*</span></label>
      <select id="m_conta"><option value="">— escolha —</option>${S.contas.map(c=>`<option value="${c.id}">${esc(c.banco+' · '+c.nome)}</option>`).join('')}</select></div>
    <div class="field full"><label>Data do pagamento</label><input id="m_data" type="date" value="${today()}"></div>
    <div class="field full"><div style="background:var(--surface);padding:12px 14px;border-radius:10px;font-size:13px">Valor da fatura: <b class="mono">${money(total)}</b> — sairá uma única saída desse valor da conta escolhida.</div></div>
  `,async()=>{
    const conta=val('m_conta');if(!conta){toast('Escolha a conta',1);return false;}
    await rpc('pagar_fatura',{p_fatura:faturaId,p_conta:conta,p_data:val('m_data')||today()});
    toast('Fatura paga e saída registrada no banco');return true;
  });
}

/* ================= LANÇAMENTOS (transações) ================= */
let lancSeg='todos';
async function renderLancamentos(c){
  await loadBasics();
  S.transacoes=await dbList('transacoes','data',false);
  $('#topbarRight').innerHTML=`<button class="btn btn-brass" onclick="formLanc()">${sicon('plus')}Novo lançamento</button>`;
  const shown=S.transacoes.filter(t=>lancSeg==='todos'||t.tipo===lancSeg);
  c.innerHTML=`
    <div class="toolbar"><div class="seg">
      ${[['todos','Todos'],['entrada','Entradas'],['saida','Saídas'],['transferencia','Transferências']].map(([k,l])=>`<button class="${lancSeg===k?'active':''}" onclick="lancSeg='${k}';render()">${l}</button>`).join('')}
    </div><button class="btn btn-brass btn-sm" style="margin-left:auto" onclick="formLanc()">${sicon('plus')}Novo</button></div>
    <div class="card"><div class="tbl-wrap">${shown.length?`<table class="data"><thead><tr><th>Data</th><th>Descrição</th><th>Conta</th><th>Categoria</th><th class="num">Valor</th><th></th></tr></thead><tbody>
      ${shown.map(t=>{const isT=t.tipo==='transferencia';const cls=t.tipo==='entrada'?'pos':t.tipo==='saida'?'neg':'';
        return `<tr><td class="mono" style="font-size:12.5px">${fmtDate(t.data)}</td>
        <td><div class="row-title">${esc(t.descricao||'—')}</div>${isT?`<div class="row-sub">→ ${esc(contaNome(t.conta_destino_id))}</div>`:''}</td>
        <td class="row-sub">${esc(contaNome(t.conta_id))}</td>
        <td class="row-sub">${isT?'<span class="pill pill-blue">transferência</span>':esc(catNome(t.categoria_id))} ${t.empresa_id?empresaTag(t.empresa_id):''}</td>

function dueBadge(d){if(d===null)return '';const cls=d<0?'due-late':d<=5?'due-soon':'due-ok';const txt=d<0?`venceu há ${-d}d`:d===0?'hoje':`em ${d}d`;return `<span class="due-badge ${cls}">${txt}</span>`;}

async function pagarConta(id){
  const x=S.contasPagar.find(y=>y.id===id);if(!x)return;
  if(!S.contas.length){toast('Cadastre uma conta bancária primeiro',1);return;}
  openModal('Pagar conta',`
    <div class="field full"><label>Pagar com qual conta?</label><select id="m_conta">${S.contas.map(c=>`<option value="${c.id}">${esc(c.banco+' · '+c.nome)}</option>`).join('')}</select></div>
    <div class="field full"><label>Data</label><input id="m_data" type="date" value="${today()}"></div>
    <div class="field full"><div style="background:var(--surface);padding:12px 14px;border-radius:10px;font-size:13px">${esc(x.descricao)} — <b class="mono">${money(x.valor)}</b>. Vai gerar uma saída no banco escolhido.</div></div>
  `,async()=>{
    const conta=val('m_conta');const dt=val('m_data')||today();
    const tx=await dbInsert('transacoes',{tipo:'saida',valor:N(x.valor),data:dt,descricao:x.descricao+' (conta paga)',
      conta_id:conta,categoria_id:x.categoria_id,situacao:'pago',forma:'boleto',origem_tipo:'conta_pagar',origem_id:x.id});
    await dbUpdate('contas_pagar',id,{status:'paga',pago_em:dt,transacao_id:tx.id});
    // recorrência: cria a próxima ocorrência
    if(x.recorrencia&&x.recorrencia!=='unica'){
      const d=new Date((x.vencimento||dt)+'T00:00:00');
      const add={mensal:()=>d.setMonth(d.getMonth()+1),anual:()=>d.setFullYear(d.getFullYear()+1),semanal:()=>d.setDate(d.getDate()+7),trimestral:()=>d.setMonth(d.getMonth()+3)};
      (add[x.recorrencia]||add.mensal)();
      await dbInsert('contas_pagar',{descricao:x.descricao,valor:N(x.valor),vencimento:d.toISOString().slice(0,10),
        categoria_id:x.categoria_id,recorrencia:x.recorrencia,link:x.link||null,status:'pendente'});
    }
    toast('Conta paga e lançada no caixa');return true;
  });
}

const STATUS_OBRA=[['planejamento','Planejamento'],['em_andamento','Em andamento'],['pausada','Pausada'],['concluida','Concluída'],['entregue','Entregue']];
const stLabel=(s)=>(STATUS_OBRA.find(x=>x[0]===s)||[s,s])[1];
const stPill=(s)=>{const m={planejamento:'blue',em_andamento:'amber',pausada:'gray',concluida:'green',entregue:'teal'};return `<span class="pill pill-${m[s]||'gray'}">${stLabel(s)}</span>`;}
async function renderObras(c){
  S.obras=await dbList('obras','created_at',false);
  S.socios=await dbList('socios','nome');
  const custos=await dbView('v_obra_custos');
  const cmap={};custos.forEach(x=>cmap[x.obra_id]=x);
  $('#topbarRight').innerHTML=`<button class="btn btn-brass" onclick="formObra()">${sicon('plus')}Nova obra</button>`;
  const totOrc=sum(S.obras,o=>N(o.orcamento)),totReal=sum(custos,x=>N(x.realizado)),totVGV=sum(S.obras,o=>N(o.vgv));
  c.innerHTML=`
    <div class="kpi-grid">
      ${kpiCard({lbl:'Obras',val:S.obras.length,sub:S.obras.filter(o=>o.status==='em_andamento').length+' em andamento',ic:'obras',tint:'brass'})}
      ${kpiCard({lbl:'Investido',val:kmoney(totReal),sub:'de '+kmoney(totOrc)+' orçados',ic:'wallet',tint:'teal'})}
      ${kpiCard({lbl:'VGV total',val:kmoney(totVGV),ic:'up',tint:'green'})}
      ${kpiCard({lbl:'Margem projetada',val:kmoney(totVGV-totOrc),sub:totOrc?((totVGV-totOrc)/totOrc*100).toFixed(0)+'% sobre custo':'',ic:'target',tint:'amber'})}
    </div>
    ${S.obras.length?`<div style="display:grid;gap:14px">${S.obras.map(o=>obraCardHTML(o,cmap[o.id])).join('')}</div>`
      :`<div class="card"><div class="empty">${sicon('obras')}<h3>Nenhuma obra ainda</h3><p>Cadastre a obra do seu pai. Depois você abre e lança cada gasto (quem pagou, você ou o sócio) — tudo entra no caixa e na equalização.</p><button class="btn btn-brass" onclick="formObra()">${sicon('plus')}Nova obra</button></div></div>`}`;
}
function obraCardHTML(o,cu){
  const real=N(cu?cu.realizado:0),saldo=N(o.orcamento)-real,over=real>N(o.orcamento)&&N(o.orcamento)>0;
  const marg=N(o.vgv)-N(o.orcamento);
  return `<div class="card"><div class="card-b" style="padding:0">
    <div style="display:flex;align-items:flex-start;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line-2)">
      <div class="kicon tint-brass" style="width:44px;height:44px;border-radius:12px">${sicon('obras')}</div>
      <div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="font-size:16px">${esc(o.nome)}</h3>${stPill(o.status)}</div>
        <div class="row-sub" style="margin-top:3px">${esc(o.endereco||'')}${o.empreendimento_id?' · '+esc(empNome(o.empreendimento_id)):''}</div></div>
      <button class="btn btn-primary btn-sm" onclick="go('obraDetail','${o.id}')">Abrir</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line-2)">
      ${obraStat('Orçamento',money0(o.orcamento))}${obraStat('Realizado',money0(real),over?'neg':'')}
      ${obraStat('Saldo',money0(saldo),saldo<0?'neg':'')}${obraStat('VGV',money0(o.vgv))}
      ${obraStat('Margem',money0(marg),marg>=0?'pos':'neg')}${obraStat('Execução',(o.progresso||0)+'%')}
    </div>
    <div style="padding:14px 20px"><div class="prog ${over?'over':''}"><i style="width:${Math.min(100,o.progresso||0)}%"></i></div></div>
  </div></div>`;
}
function obraStat(l,v,cls=''){return `<div style="background:#fff;padding:12px 15px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600">${l}</div><div class="mono ${cls}" style="font-size:15px;font-weight:600;margin-top:2px">${v}</div></div>`;}

let obraSociosEdit=[];
async function formObra(id){
  await Promise.all([
    S.socios.length?null:dbList('socios','nome').then(d=>S.socios=d),
    S.empreendimentos.length?null:dbList('empreendimentos','nome').then(d=>S.empreendimentos=d)
  ]);
  let o={status:'em_andamento',orcamento:0,vgv:0,progresso:0,socios:[]};
  if(id){o=await dbOne('obras',id);o.socios=await dbWhere('obra_socios','obra_id',id);}
  obraSociosEdit=(o.socios||[]).map(s=>({socio_id:s.socio_id,participacao:s.participacao}));
  const empOpts='<option value="">— nenhum —</option>'+S.empreendimentos.map(e=>`<option value="${e.id}" ${o.empreendimento_id===e.id?'selected':''}>${esc(e.nome)}</option>`).join('');
  openModalK('obra:'+(id||'new'),id?'Editar obra':'Nova obra',`
    <div class="field full"><label>Nome da obra <span class="hint">*</span></label><input id="m_nome" value="${esc(o.nome||'')}" placeholder="Ex.: Sobrado Jardim Aurora"></div>
    <div class="field"><label>Empreendimento</label><select id="m_empreendimento_id">${empOpts}</select></div>
    <div class="field"><label>Endereço</label><input id="m_endereco" value="${esc(o.endereco||'')}"></div>
    <div class="field"><label>Orçamento previsto</label><div class="prefix"><input id="m_orcamento" type="text" inputmode="decimal" class="moeda" value="${o.orcamento||0}"></div></div>
    <div class="field"><label>VGV (valor de venda)</label><div class="prefix"><input id="m_vgv" type="text" inputmode="decimal" class="moeda" value="${o.vgv||0}"></div></div>
    <div class="field"><label>Início</label><input id="m_data_inicio" type="date" value="${(o.data_inicio||'').slice(0,10)}"></div>
    <div class="field"><label>Previsão de entrega</label><input id="m_data_prevista" type="date" value="${(o.data_prevista||'').slice(0,10)}"></div>
    <div class="field"><label>Execução (%)</label><input id="m_progresso" type="number" min="0" max="100" value="${o.progresso||0}"></div>
    <div class="field"><label>Situação</label><select id="m_status">${STATUS_OBRA.map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field full"><label>Sócios e participação <span class="hint">(deixe vazio se a obra é só do seu pai)</span></label>
      <div id="socRows">${obraSociosEdit.map(socRowHTML).join('')}</div>
      <button class="add-line" onclick="addSocRow()">${sicon('plus')}Adicionar sócio</button></div>
  `,async()=>{
    if(!val('m_nome')){toast('Informe o nome da obra',1);return false;}
    const row={nome:val('m_nome'),empreendimento_id:val('m_empreendimento_id')||null,endereco:val('m_endereco'),
      orcamento:N(val('m_orcamento')),vgv:N(val('m_vgv')),data_inicio:val('m_data_inicio')||null,data_prevista:val('m_data_prevista')||null,
      progresso:N(val('m_progresso')),status:val('m_status')};
    let obraId=id;
    if(id)await dbUpdate('obras',id,row);else{const nw=await dbInsert('obras',row);obraId=nw.id;}
    // sincroniza sócios: apaga os atuais e recria (simples e robusto)
    const rows=$$('#socRows .socio-row').map(r=>({socio_id:$('.s-id',r).value,participacao:N($('.s-part',r).value)})).filter(s=>s.socio_id&&s.participacao);
    const atuais=await dbWhere('obra_socios','obra_id',obraId);
    for(const a of atuais)await dbDelete('obra_socios',a.id);
    for(const s of rows)await dbInsert('obra_socios',{obra_id:obraId,socio_id:s.socio_id,participacao:s.participacao});
    toast('Obra salva');return true;
  },'','wide');
}
function socRowHTML(sp){sp=sp||{socio_id:'',participacao:''};
  const opts=S.socios.map(s=>`<option value="${s.id}" ${sp.socio_id===s.id?'selected':''}>${esc(s.nome)}</option>`).join('');
  return `<div class="socio-row"><select class="s-id">${opts||'<option value="">cadastre sócios</option>'}</select>
    <input class="s-part" type="number" placeholder="%" value="${sp.participacao||''}" style="text-align:right">
    <button class="rm" onclick="this.closest('.socio-row').remove()">${sicon('x')}</button></div>`;}
function addSocRow(){if(!S.socios.length){toast('Cadastre sócios primeiro (menu Sócios)',1);return;}$('#socRows').insertAdjacentHTML('beforeend',socRowHTML());}

      ${obraStat('Orçamento',money0(o.orcamento))}${obraStat('Realizado',money0(real),over?'neg':'')}${obraStat('Saldo',money0(saldo),saldo<0?'neg':'')}
      ${obraStat('Execução',(o.progresso||0)+'%')}${obraStat('VGV',money0(o.vgv))}${obraStat('Margem',money0(marg),marg>=0?'pos':'neg')}${obraStat('ROI',roi.toFixed(1)+'%',roi>=0?'pos':'neg')}

async function setDocObs(oid,nm,v){const o=await dbOne('obras',oid);const docs=o.docs||{};docs[nm]=docs[nm]||{ok:false,obs:''};docs[nm].obs=v;await dbUpdate('obras',oid,{docs});toast('Salvo');}
async function delObraDetail(id){if(!confirm('Excluir esta obra e seus vínculos? Os gastos já lançados no caixa permanecem.'))return;await dbDelete('obras',id);toast('Obra excluída');go('obras');}
async function delRegObra(table,id,label,oid){if(!confirm(`Excluir ${label.toLowerCase()}?`))return;await dbDelete(table,id);toast(label+' excluído');render();}
async function delGastoObra(id,oid){if(!confirm('Excluir este gasto? Se foi à vista, o lançamento no caixa também será removido.'))return;
  // remove a transação vinculada (à vista), se houver
  const{data:txs}=await SB.from('transacoes').select('id').eq('origem_tipo','compra').eq('origem_id',id);
  if(txs)for(const t of txs)await dbDelete('transacoes',t.id);
  await dbDelete('compras',id);toast('Gasto excluído');render();}

async function formGastoObra(oid){
  if(!S.categorias.length)S.categorias=await dbList('categorias','nome');

    <div class="field"><label>Valor</label><div class="prefix"><input id="m_valor" type="text" inputmode="decimal" class="moeda"></div></div>
    <div class="field"><label>Quem pagou</label><select id="m_socio_id">${socOpts}</select></div>
    <div class="field"><label>Categoria</label><select id="m_categoria_id"><option value="">—</option>${cats.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>

    <div class="field"><label>Data</label><input id="m_data" type="date" value="${today()}"></div>
    <div class="field full"><label>Como foi pago?</label><select id="m_forma" onchange="gastoFormaChange()">${['pix','dinheiro','debito','transferencia','boleto','cartao'].map(f=>`<option value="${f}">${f==='cartao'?'Cartão (vai pra fatura)':f+' (à vista — sai do caixa)'}</option>`).join('')}</select></div>
    <div class="field full ${''}" id="wrap_conta"><label>Sai de qual conta?</label><select id="m_conta_id">${contaOpts||'<option value="">cadastre uma conta</option>'}</select></div>
    <div class="field full hide" id="wrap_cartao"><label>Qual cartão?</label><select id="m_cartao_id">${cartOpts||'<option value="">cadastre um cartão</option>'}</select><label style="margin-top:8px">Parcelas</label><input id="m_parcelas_qtd" type="number" min="1" value="1"></div>

    const forma=val('m_forma');
    const compra={descricao:val('m_descricao'),valor:v,data:val('m_data'),forma,obra_id:oid,
      categoria_id:val('m_categoria_id')||null,etapa_id:val('m_etapa_id')||null,socio_id:val('m_socio_id')||null};
    if(forma==='cartao'){
      const cartao=val('m_cartao_id');if(!cartao){toast('Escolha o cartão',1);return false;}
      compra.cartao_id=cartao;compra.parcelas_qtd=N(val('m_parcelas_qtd'))||1;
      await dbInsert('compras',compra);
      toast('Gasto lançado — parcelas na fatura');
    }else{
      const conta=val('m_conta_id');if(!conta){toast('Escolha a conta',1);return false;}
      const cp=await dbInsert('compras',{...compra,conta_id:conta,parcelas_qtd:1});
      // à vista: gera a saída no caixa, vinculada à compra (origem_tipo='compra')
      await dbInsert('transacoes',{tipo:'saida',valor:v,data:val('m_data'),descricao:val('m_descricao'),

        origem_tipo:'compra',origem_id:cp.id});
      toast('Gasto lançado e debitado do caixa');
    }
    return true;
  },'','wide');

async function matchImoveis(leadId){
  const l=S.leads.find(x=>x.id===leadId);if(!S.imoveis.length)S.imoveis=await dbList('imoveis','titulo');
  const preco=(i)=>l.finalidade==='aluguel'?N(i.valor_aluguel):N(i.valor_venda);
  const compat=S.imoveis.filter(i=>{
    if(['vendido','alugado','indisponivel'].includes(i.status))return false;
    if(l.finalidade&&l.finalidade!=='ambos'&&i.finalidade!=='ambos'&&i.finalidade!==l.finalidade)return false;
    const p=preco(i);
    if(N(l.preco_min)&&p&&p<N(l.preco_min))return false;
    if(N(l.preco_max)&&p&&p>N(l.preco_max))return false;
    if(N(l.quartos_min)&&N(i.quartos)&&N(i.quartos)<N(l.quartos_min))return false;
    if(N(l.vagas_min)&&N(i.vagas)&&N(i.vagas)<N(l.vagas_min))return false;
    return true;
  });
  openModal(`Imóveis para ${l.nome}`,compat.length?`<div class="field full" style="grid-column:1/-1">${compat.map(i=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)">
      <div class="kicon tint-brass" style="width:38px;height:38px;border-radius:10px">${sicon('imoveis')}</div>
      <div style="flex:1"><div class="row-title">${esc(i.titulo)}</div><div class="row-sub">${esc(i.tipo||'')}${i.cidade?' · '+esc(i.cidade):''} · ${N(i.quartos)||'?'}q ${N(i.vagas)||0}vg</div></div>
      <div class="mono" style="font-weight:600">${money0(preco(i))}</div></div>`).join('')}</div>`
    :`<div class="field full" style="grid-column:1/-1"><div class="empty" style="padding:20px">${sicon('imoveis')}<p style="margin:0">Nenhum imóvel cadastrado bate com os critérios deste lead. Quanto mais imóveis e dados cadastrados, melhor o match.</p></div></div>`,
    null);
  $('#modalSaveBtn').classList.add('hide');
}

let relPeriodo='6m';
function periodoInicio(p){const d=new Date();if(p==='mes')return d.toISOString().slice(0,7)+'-01';
  if(p==='ano')return d.getFullYear()+'-01-01';
  if(p==='tudo')return '2000-01-01';
  const m={'3m':3,'6m':6,'12m':12}[p]||6;d.setMonth(d.getMonth()-m);return d.toISOString().slice(0,10);}
async function renderRelatorios(c){
  if(!S.categorias.length)S.categorias=await dbList('categorias','nome');
  if(!S.obras.length)S.obras=await dbList('obras','nome');
  const inicio=periodoInicio(relPeriodo);
  const{data:txs}=await SB.from('transacoes').select('*').gte('data',inicio).order('data',{ascending:false});
  const T=(txs||[]).filter(t=>t.situacao==='pago');
  const ent=sum(T.filter(t=>t.tipo==='entrada'),t=>N(t.valor));
  const sai=sum(T.filter(t=>t.tipo==='saida'),t=>N(t.valor));
  // por categoria (saídas)
  const porCat={};T.filter(t=>t.tipo==='saida').forEach(t=>{const k=catNome(t.categoria_id)||'Sem categoria';porCat[k]=(porCat[k]||0)+N(t.valor);});
  const catArr=Object.keys(porCat).map(k=>({k,v:porCat[k]})).sort((a,b)=>b.v-a.v);
  // por obra
  const porObra={};T.filter(t=>t.obra_id).forEach(t=>{const o=S.obras.find(o=>o.id===t.obra_id);const k=o?o.nome:'—';porObra[k]=(porObra[k]||0)+(t.tipo==='saida'?N(t.valor):0);});
  const obraArr=Object.keys(porObra).map(k=>({k,v:porObra[k]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  // fluxo mensal
  const fm={};T.forEach(t=>{const k=monthKey(t.data);fm[k]=fm[k]||{ent:0,sai:0};fm[k][t.tipo==='entrada'?'ent':'sai']+=N(t.valor);});
  const fmArr=Object.keys(fm).sort().map(k=>({k,...fm[k]}));

  $('#topbarRight').innerHTML=`<button class="btn btn-ghost" onclick='exportarCSV(${JSON.stringify(inicio)})'>${sicon('download')}Exportar CSV</button>`;
  c.innerHTML=`
    <div class="toolbar"><div class="seg">
      ${[['mes','Este mês'],['3m','3 meses'],['6m','6 meses'],['12m','12 meses'],['ano','Este ano'],['tudo','Tudo']].map(([k,l])=>`<button class="${relPeriodo===k?'active':''}" onclick="relPeriodo='${k}';render()">${l}</button>`).join('')}
    </div></div>
    <div class="kpi-grid">
      ${kpiCard({lbl:'Entradas',val:kmoney(ent),ic:'down',tint:'green'})}
      ${kpiCard({lbl:'Saídas',val:kmoney(sai),ic:'up',tint:'red'})}
      ${kpiCard({lbl:'Resultado',val:kmoney(ent-sai),sub:'no período',ic:'relatorios',tint:'brass'})}
      ${kpiCard({lbl:'Lançamentos',val:T.length,ic:'lancamentos',tint:'blue'})}
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-h"><h3>Fluxo mensal</h3></div><div class="card-b">${fmArr.length?`<div class="chart-box"><canvas id="relFluxo"></canvas></div>`:'<div class="row-sub">Sem dados no período.</div>'}</div></div>
      <div class="card"><div class="card-h"><h3>Despesas por categoria</h3></div>
        <div class="card-b">${catArr.length?catArr.slice(0,8).map(x=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${esc(x.k)}</span><span class="mono" style="font-weight:600">${money0(x.v)}</span></div><div class="prog"><i style="width:${sai?x.v/sai*100:0}%"></i></div></div>`).join(''):'<div class="row-sub">Sem despesas no período.</div>'}</div></div>
    </div>
    ${obraArr.length?`<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Despesas por obra</h3></div><div class="tbl-wrap"><table class="data"><thead><tr><th>Obra</th><th class="num">Gasto no período</th></tr></thead><tbody>${obraArr.map(x=>`<tr><td class="row-title">${esc(x.k)}</td><td class="num">${money0(x.v)}</td></tr>`).join('')}</tbody></table></div></div>`:''}
    <div class="card"><div class="card-h"><h3>Lançamentos do período</h3><span class="sub">${T.length} registro(s)</span></div>
      <div class="tbl-wrap">${T.length?`<table class="data"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Conta</th><th class="num">Valor</th></tr></thead><tbody>
        ${T.slice(0,150).map(t=>`<tr><td class="mono" style="font-size:12.5px">${fmtDate(t.data)}</td><td class="row-title">${esc(t.descricao||'—')}</td><td class="row-sub">${t.tipo==='transferencia'?'transferência':esc(catNome(t.categoria_id))}</td><td class="row-sub">${esc(contaNome(t.conta_id))}</td><td class="num"><b class="${t.tipo==='entrada'?'pos':t.tipo==='saida'?'neg':''}">${t.tipo==='entrada'?'+':t.tipo==='saida'?'−':''} ${money(t.valor)}</b></td></tr>`).join('')}
      </tbody></table>${T.length>150?`<div class="row-sub" style="padding:12px 14px">Mostrando 150 de ${T.length}. Exporte o CSV para ver tudo.</div>`:''}`:`<div class="empty">${sicon('relatorios')}<h3>Sem lançamentos no período</h3><p>Ajuste o período acima ou registre movimentos no Financeiro.</p></div>`}</div>`;
  if(fmArr.length)mkChart('relFluxo',{type:'bar',data:{labels:fmArr.map(x=>fmtMonth(x.k)),datasets:[
    {label:'Entradas',data:fmArr.map(x=>x.ent),backgroundColor:'#2E8B62',borderRadius:5,maxBarThickness:20},
    {label:'Saídas',data:fmArr.map(x=>x.sai),backgroundColor:'#B5504A',borderRadius:5,maxBarThickness:20}]},
    options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,usePointStyle:true,padding:14}},tooltip:{callbacks:{label:x=>x.dataset.label+': '+money0(x.raw)}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#EDEFEA'},ticks:{callback:v=>kmoney(v)}}}}});
}
async function exportarCSV(inicio){
  const{data:txs}=await SB.from('transacoes').select('*').gte('data',inicio).order('data',{ascending:false});
  const T=txs||[];
  const head=['Data','Tipo','Descrição','Categoria','Conta','Obra','Situação','Valor'];
  const linhas=T.map(t=>[t.data,t.tipo,(t.descricao||'').replace(/"/g,'""'),catNome(t.categoria_id),contaNome(t.conta_id).replace(/"/g,'""'),t.obra_id?(S.obras.find(o=>o.id===t.obra_id)||{}).nome||'':'',t.situacao,N(t.valor).toFixed(2)]);
  const csv=[head,...linhas].map(r=>r.map(x=>`"${x??''}"`).join(';')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});

async function formDocumento(){
  await Promise.all([S.obras.length?0:dbList('obras','nome').then(d=>S.obras=d),S.imoveis.length?0:dbList('imoveis','titulo').then(d=>S.imoveis=d),S.fornecedores.length?0:dbList('fornecedores','nome').then(d=>S.fornecedores=d),S.proprietarios.length?0:dbList('proprietarios','nome').then(d=>S.proprietarios=d)]);
  openModalK('documento:new','Enviar documento',`
    <div class="field full"><label>Arquivo <span class="hint">*</span></label><input id="m_file" type="file"></div>
    <div class="field"><label>Nome</label><input id="m_nome" placeholder="(usa o nome do arquivo se vazio)"></div>
    <div class="field"><label>Tipo</label><select id="m_tipo">${['Boleto','Nota fiscal','Contrato','Recibo','Matrícula','Comprovante','Outro'].map(t=>`<option>${t}</option>`).join('')}</select></div>

    <div class="field" id="wrap_ent"><label>Registro</label><select id="m_entidade_id"><option value="">—</option></select></div>
    <div class="field"><label>Vencimento <span class="hint">(opcional)</span></label><input id="m_vencimento" type="date"></div>
  `,async()=>{
    const fileEl=$('#m_file');const file=fileEl&&fileEl.files&&fileEl.files[0];
    if(!file){toast('Escolha um arquivo',1);return false;}
    const ent=val('m_entidade');const path=`${ent}/${val('m_entidade_id')||'geral'}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
    const{error:upErr}=await SB.storage.from(BUCKET).upload(path,file);
    if(upErr){toast('Falha no upload: '+(/bucket/i.test(upErr.message)?'crie o bucket "documentos" no Storage do Supabase':upErr.message),1);return false;}
    await dbInsert('documentos',{nome:val('m_nome')||file.name,tipo:val('m_tipo'),storage_path:path,entidade:ent,entidade_id:val('m_entidade_id')||'00000000-0000-0000-0000-000000000000',vencimento:val('m_vencimento')||null});

function docEntidadeChange(){
  const ent=val('m_entidade');const sel=$('#m_entidade_id');if(!sel)return;
  const map={obra:S.obras.map(o=>[o.id,o.nome]),imovel:S.imoveis.map(i=>[i.id,i.titulo]),fornecedor:S.fornecedores.map(f=>[f.id,f.nome]),proprietario:S.proprietarios.map(p=>[p.id,p.nome])};
  const opts=map[ent]||[];
  $('#wrap_ent').style.display=opts.length?'flex':'none';
  sel.innerHTML='<option value="">—</option>'+opts.map(([id,nm])=>`<option value="${id}">${esc(nm)}</option>`).join('');
}
async function verDocumento(path){
  if(!path){toast('Sem arquivo',1);return;}
  const{data,error}=await SB.storage.from(BUCKET).createSignedUrl(path,3600);
  if(error){toast('Não consegui abrir: '+error.message,1);return;}
  window.open(data.signedUrl,'_blank');
}
async function delDocumento(id,path){
  if(!confirm('Excluir este documento?'))return;
  if(path)await SB.storage.from(BUCKET).remove([path]);
  await dbDelete('documentos',id);toast('Documento excluído');render();
}

    {t:'Fornecedores',tabela:'fornecedores',col:'nome',rota:'fornecedores',nome:r=>r.nome,sub:r=>r.telefone||''},

    {t:'Proprietários',tabela:'proprietarios',col:'nome',rota:'proprietarios',nome:r=>r.nome,sub:r=>r.telefone||''},
    {t:'Contas a pagar',tabela:'contas_pagar',col:'descricao',rota:'pagar',nome:r=>r.descricao,sub:r=>money(r.valor)},
    {t:'Contas a receber',tabela:'contas_receber',col:'descricao',rota:'receber',nome:r=>r.descricao,sub:r=>money(r.valor)},
    {t:'Patrimônio',tabela:'patrimonio',col:'nome',rota:'patrimonio',nome:r=>r.nome,sub:r=>lbl(TIPO_PAT,r.tipo)},
  ];
  const results=await Promise.all(fontes.map(async f=>{
    try{const{data}=await SB.from(f.tabela).select('*').ilike(f.col,like).limit(10);return{f,rows:data||[]};}catch(e){return{f,rows:[]};}

}

/* ================= EXTRATO (livro-caixa com saldo acumulado) ================= */
let exPeriodo='mes', exEmpresa='', exConta='';
async function renderExtrato(c){
  await loadBasics();
  S.transacoes=await dbList('transacoes','data',true); // asc p/ saldo corrido
  const inicio=periodoInicio(exPeriodo);
  // saldo inicial: base das contas (se filtrada 1 conta, só dela) + movimentos ANTES do período
  let contasBase=exConta?S.contas.filter(x=>x.id===exConta):S.contas;
  let saldoInicial=sum(contasBase,x=>N(x.saldo_inicial));
  const antes=S.transacoes.filter(t=>t.situacao==='pago'&&(''+t.data)<inicio);
  const noPeriodo=S.transacoes.filter(t=>t.situacao==='pago'&&(''+t.data)>=inicio
    &&(!exEmpresa||t.empresa_id===exEmpresa)
    &&(!exConta||t.conta_id===exConta||t.conta_destino_id===exConta));
  const efeito=(t)=>{ // efeito no conjunto de contas-base (ou geral)
    let d=0;
    const inBase=(id)=>!exConta?!!id:id===exConta;
    if(t.tipo==='entrada'&&inBase(t.conta_id))d+=N(t.valor);
    else if(t.tipo==='saida'&&inBase(t.conta_id))d-=N(t.valor);
    else if(t.tipo==='transferencia'){if(inBase(t.conta_destino_id))d+=N(t.valor);if(inBase(t.conta_id))d-=N(t.valor);}
    return d;
  };
  // saldo acumulado até antes do período
  antes.filter(t=>!exEmpresa||t.empresa_id===exEmpresa).forEach(t=>{saldoInicial+=efeito(t);});
  let saldo=saldoInicial;
  const linhas=noPeriodo.map(t=>{const d=efeito(t);saldo+=d;return {t,d,saldo};});
  const totEnt=sum(noPeriodo.filter(t=>t.tipo==='entrada'),t=>N(t.valor));
  const totSai=sum(noPeriodo.filter(t=>t.tipo==='saida'),t=>N(t.valor));

  $('#topbarRight').innerHTML=`<button class="btn btn-ghost" onclick="gerenciarEmpresas()">${sicon('empresa')}Empresas</button>`;
  c.innerHTML=`
    <div class="toolbar">
      <div class="seg">${[['mes','Mês'],['3m','3m'],['6m','6m'],['12m','12m'],['ano','Ano'],['tudo','Tudo']].map(([k,l])=>`<button class="${exPeriodo===k?'active':''}" onclick="exPeriodo='${k}';render()">${l}</button>`).join('')}</div>
      <select onchange="exEmpresa=this.value;render()" style="padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card)"><option value="">Todas as empresas</option>${S.empresas.map(e=>`<option value="${e.id}" ${exEmpresa===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>
      <select onchange="exConta=this.value;render()" style="padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card)"><option value="">Todas as contas</option>${S.contas.map(cc=>`<option value="${cc.id}" ${exConta===cc.id?'selected':''}>${esc(cc.banco+' · '+cc.nome)}</option>`).join('')}</select>
    </div>
    <div class="kpi-grid">
      ${kpiCard({lbl:'Saldo inicial do período',val:money0(saldoInicial),ic:'wallet',tint:'brass'})}
      ${kpiCard({lbl:'Entradas',val:kmoney(totEnt),ic:'down',tint:'green'})}
      ${kpiCard({lbl:'Saídas',val:kmoney(totSai),ic:'up',tint:'red'})}
      ${kpiCard({lbl:'Saldo final',val:money0(saldo),sub:(saldo-saldoInicial>=0?'+':'')+money0(saldo-saldoInicial)+' no período',ic:'extrato',tint:'teal'})}
    </div>
    <div class="card"><div class="card-h"><h3>Extrato — saldo acumulado</h3><span class="sub">cada linha soma na anterior</span></div>
    <div class="tbl-wrap">${linhas.length?`<table class="data"><thead><tr><th>Data</th><th>Descrição</th><th>Empresa</th><th class="num">Entrada</th><th class="num">Saída</th><th class="num">Saldo</th></tr></thead><tbody>
      <tr style="background:#FAFBF8"><td colspan="5" class="row-sub" style="text-align:right">Saldo inicial</td><td class="num"><b>${money(saldoInicial)}</b></td></tr>
      ${linhas.map(({t,d,saldo})=>`<tr><td class="mono" style="font-size:12.5px">${fmtDate(t.data)}</td>
        <td><div class="row-title">${esc(t.descricao||'—')}</div><div class="row-sub">${esc(contaNome(t.conta_id))}${t.tipo==='transferencia'?' → '+esc(contaNome(t.conta_destino_id)):(t.categoria_id?' · '+esc(catNome(t.categoria_id)):'')}</div></td>
        <td>${t.empresa_id?empresaTag(t.empresa_id):'<span class="row-sub">—</span>'}</td>
        <td class="num pos">${d>0?money(d):''}</td>
        <td class="num neg">${d<0?money(-d):''}</td>
        <td class="num"><b class="${saldo<0?'neg':''}">${money(saldo)}</b></td></tr>`).join('')}
    </tbody></table>`:`<div class="empty">${sicon('extrato')}<h3>Sem movimento no período</h3><p>Escolha outro período ou registre lançamentos. O saldo corrido aparece aqui, estilo extrato bancário.</p></div>`}</div></div>`;
}
