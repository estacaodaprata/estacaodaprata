  const linhas=catsDesp.map(cat=>{const o=orcDe(cat.id);const limite=N(o?o.limite:0);const gasto=gastoCat(cat.id);return {cat,limite,gasto,resta:limite-gasto,pct:limite?Math.min(100,gasto/limite*100):0};}).filter(l=>l.limite>0||l.gasto>0);
  const totLim=sum(linhas,l=>l.limite),totGasto=sum(linhas,l=>l.gasto);
  // meses p/ seletor (12 últimos)
  const meses=[];{const d=new Date();for(let i=0;i<12;i++){meses.push(d.toISOString().slice(0,7));d.setMonth(d.getMonth()-1);}}

  $('#topbarRight').innerHTML=`<button class="btn btn-ghost" onclick="gerenciarEmpresas()">${sicon('empresa')}Empresas</button> <button class="btn btn-brass" onclick="formOrcamento()">${sicon('plus')}Definir limite</button>`;
  c.innerHTML=`
    <div class="toolbar">
      <select onchange="orcMes=this.value;render()" style="padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card)">${meses.map(m=>`<option value="${m}" ${orcMes===m?'selected':''}>${fmtMonth(m)}</option>`).join('')}</select>
      <select onchange="orcEmpresa=this.value;render()" style="padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card)"><option value="">Todas as empresas</option>${S.empresas.map(e=>`<option value="${e.id}" ${orcEmpresa===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>
    </div>
    <div class="kpi-grid">
      ${kpiCard({lbl:'Previsto (limites)',val:kmoney(totLim),ic:'orcamento',tint:'brass'})}
      ${kpiCard({lbl:'Realizado (já gastei)',val:kmoney(totGasto),ic:'up',tint:'red'})}
      ${kpiCard({lbl:'Ainda posso gastar',val:kmoney(totLim-totGasto),sub:totLim?pctTxt(totGasto/totLim*100)+' usado':'',ic:'wallet',tint:(totLim-totGasto)>=0?'green':'red'})}
    </div>
    <div class="card"><div class="card-h"><h3>Orçamento por categoria</h3><span class="sub">${fmtMonth(orcMes)}${orcEmpresa?' · '+esc(empresaNome(orcEmpresa)):' · todas as empresas'}</span></div>
    <div class="tbl-wrap">${linhas.length?`<table class="data"><thead><tr><th>Categoria</th><th class="num">Limite</th><th class="num">Já gastei</th><th class="num">Ainda posso</th><th style="width:30%">Uso</th><th></th></tr></thead><tbody>
      ${linhas.map(l=>`<tr><td class="row-title">${esc(l.cat.nome)}</td>
        <td class="num">${l.limite?money(l.limite):'<span class="row-sub">—</span>'}</td>
        <td class="num">${money(l.gasto)}</td>
        <td class="num"><b class="${l.resta<0?'neg':'pos'}">${money(l.resta)}</b></td>
        <td><div class="prog ${l.pct>=100?'over':''}" style="min-width:120px"><i style="width:${l.pct}%"></i></div><div class="row-sub" style="margin-top:3px">${l.limite?pctTxt(l.pct)+(l.resta<0?' · estourou':''):'sem limite'}</div></td>
        <td><div class="t-actions"><button class="icon-btn" onclick='formOrcamento("${l.cat.id}")'>${sicon('edit')}</button></div></td></tr>`).join('')}
    </tbody></table>`:`<div class="empty">${sicon('orcamento')}<h3>Nenhum limite definido</h3><p>Defina um limite mensal por categoria (Casa, Alimentação, Transporte…). O "já gastei" e o "ainda posso gastar" são somados sozinhos dos lançamentos.</p><button class="btn btn-brass" onclick="formOrcamento()">${sicon('plus')}Definir limite</button></div>`}</div></div>`;
}
function pctTxt(p){return (Number(p)||0).toFixed(0)+'%';}
async function formOrcamento(catId){
  await loadBasics();
  if(!S.orcamentos.length)S.orcamentos=await dbList('orcamentos','created_at').catch(()=>[]);
  const catsDesp=S.categorias.filter(x=>x.tipo==='saida');
  const existente=catId?S.orcamentos.find(o=>o.categoria_id===catId&&((orcEmpresa&&o.empresa_id===orcEmpresa)||(!orcEmpresa&&!o.empresa_id))):null;
  openModalK('orcamento:'+(catId||'new')+':'+(orcEmpresa||'all'),'Limite da categoria',`
    <div class="field full"><label>Categoria <span class="hint">*</span></label><select id="m_categoria_id" ${catId?'disabled':''}>${catsDesp.map(cc=>`<option value="${cc.id}" ${(catId===cc.id||existente&&existente.categoria_id===cc.id)?'selected':''}>${esc(cc.nome)}</option>`).join('')}</select></div>
    <div class="field full"><label>Empresa <span class="hint">(deixe "todas" para o limite geral)</span></label><select id="m_empresa_id"><option value="">Todas as empresas</option>${S.empresas.map(e=>`<option value="${e.id}" ${((existente&&existente.empresa_id===e.id)||(!existente&&orcEmpresa===e.id))?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>
    <div class="field full"><label>Limite mensal</label><div class="prefix"><input id="m_limite" type="text" inputmode="decimal" class="moeda" value="${existente?existente.limite:''}"></div></div>
  `,async()=>{
    const cat=catId||val('m_categoria_id');const emp=val('m_empresa_id')||null;const limite=N(val('m_limite'));
    if(!cat){toast('Escolha a categoria',1);return false;}
    const atual=S.orcamentos.find(o=>o.categoria_id===cat&&(o.empresa_id||null)===(emp||null));
    if(atual)await dbUpdate('orcamentos',atual.id,{limite});
    else await dbInsert('orcamentos',{categoria_id:cat,empresa_id:emp,limite});
    toast('Limite salvo');return true;
  });
}

/* ================= GESTÃO DE EMPRESAS ================= */
async function gerenciarEmpresas(){
  await loadEmpresas();
  const linhas=()=>S.empresas.map(e=>`<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px" data-id="${e.id}">
    <input type="color" value="${esc(e.cor||'#B08A45')}" onchange="updEmpresa('${e.id}','cor',this.value)" style="width:34px;height:34px;border:none;border-radius:8px;padding:0;background:none;cursor:pointer">
    <input value="${esc(e.nome)}" onchange="updEmpresa('${e.id}','nome',this.value)" style="flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:8px">
    <input value="${esc(e.sufixo||'')}" onchange="updEmpresa('${e.id}','sufixo',this.value)" placeholder="sufixo" style="width:72px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-align:center">
    <button class="icon-btn del" onclick="rmEmpresa('${e.id}')">${sicon('trash')}</button></div>`).join('');
  openModal('Empresas','<div class="field full" style="grid-column:1/-1"><label>Separe seus CNPJs / origens de dinheiro</label><div id="empList">'+(linhas()||'<div class="row-sub">Nenhuma empresa.</div>')+'</div><button class="add-line" onclick="addEmpresa()">'+sicon('plus')+'Adicionar empresa</button></div>',null);
  $('#modalSaveBtn').textContent='Fechar';$('#modalSaveBtn').onclick=()=>{closeModal();render();};
}
async function addEmpresa(){const e=await dbInsert('empresas',{nome:'Nova empresa',sufixo:'',cor:'#B08A45'});S.empresas.push(e);$('#empList').insertAdjacentHTML('beforeend',`<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px" data-id="${e.id}">
  <input type="color" value="#B08A45" onchange="updEmpresa('${e.id}','cor',this.value)" style="width:34px;height:34px;border:none;border-radius:8px;padding:0;background:none;cursor:pointer">
  <input value="Nova empresa" onchange="updEmpresa('${e.id}','nome',this.value)" style="flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:8px">
  <input value="" onchange="updEmpresa('${e.id}','sufixo',this.value)" placeholder="sufixo" style="width:72px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-align:center">
  <button class="icon-btn del" onclick="rmEmpresa('${e.id}')">${sicon('trash')}</button></div>`);}
async function updEmpresa(id,campo,v){try{await dbUpdate('empresas',id,{[campo]:v});const e=S.empresas.find(x=>x.id===id);if(e)e[campo]=v;toast('Salvo');}catch(err){toast(traduzErro(err.message),1);}}
async function rmEmpresa(id){if(!confirm('Remover esta empresa? Os lançamentos ficam sem empresa, mas não são apagados.'))return;try{await dbDelete('empresas',id);S.empresas=S.empresas.filter(x=>x.id!==id);const el=document.querySelector('#empList [data-id="'+id+'"]');if(el)el.remove();toast('Empresa removida');}catch(e){toast(traduzErro(e.message),1);}}

/* ================= MODAL genérico ================= */
let modalSave=null,currentDraftKey=null;
function parseMoeda(s){if(s==null||s==='')return 0;const n=Number((''+s).replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''));return isNaN(n)?0:n;}
function moeda2(n){return (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function val(id){const e=$('#'+id);if(!e)return '';if(e.classList&&e.classList.contains('moeda'))return String(parseMoeda(e.value));return e.value.trim();}
function maskMoedaLive(el){let d=(el.value||'').replace(/\D/g,'');if(!d){el.value='';return;}d=String(parseInt(d,10));while(d.length<3)d='0'+d;let cents=d.slice(-2),int=d.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');el.value=int+','+cents;}
function initMoedaInputs(){$$('#modal .moeda').forEach(el=>{if(el.value!==''&&!/,/.test(el.value)){const n=Number(el.value);if(!isNaN(n))el.value=moeda2(n);}el.addEventListener('input',()=>maskMoedaLive(el));});}
/* ---- rascunho automático ---- */
function draftFields(){return $$('#modal input, #modal select, #modal textarea').filter(e=>e.id&&e.type!=='file'&&e.type!=='password');}
function draftSave(){if(!currentDraftKey)return;const o={};draftFields().forEach(e=>{o[e.id]=e.value;});try{localStorage.setItem('cvdraft:'+currentDraftKey,JSON.stringify(o));}catch(e){}}
function draftRestore(){if(!currentDraftKey)return false;let o;try{o=JSON.parse(localStorage.getItem('cvdraft:'+currentDraftKey)||'null');}catch(e){o=null;}if(!o)return false;let usou=false;draftFields().forEach(e=>{if(o[e.id]!=null&&o[e.id]!==''){e.value=o[e.id];usou=true;}});return usou;}
function draftClear(){if(currentDraftKey){try{localStorage.removeItem('cvdraft:'+currentDraftKey);}catch(e){}}}
function openModal(titulo,bodyHTML,onSave,hint,size,draftKey){
  modalSave=onSave;currentDraftKey=draftKey||null;
  $('#modal').className='modal'+(size==='wide'?' wide':'');
  $('#modal').innerHTML=`
    <div class="modal-h"><h3>${esc(titulo)}</h3>${hint?`<p>${esc(hint)}</p>`:''}<button class="close" onclick="closeModal()">${sicon('x')}</button></div>
    <div class="modal-b"><div class="form-grid">${bodyHTML}</div></div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="modalSaveBtn" onclick="runSave()">${sicon('check')}Salvar</button></div>`;
  initMoedaInputs();
  const restaurou=draftRestore();
  draftFields().forEach(e=>{e.addEventListener('input',draftSave);e.addEventListener('change',draftSave);});
  $('#overlay').classList.add('show');
  if(restaurou)toast('Rascunho recuperado');
}
function closeModal(){$('#overlay').classList.remove('show');modalSave=null;currentDraftKey=null;}
function openModalK(draftKey,titulo,bodyHTML,onSave,hint,size){return openModal(titulo,bodyHTML,onSave,hint,size,draftKey);}
async function runSave(){
  if(!modalSave)return;
  const btn=$('#modalSaveBtn');btn.disabled=true;btn.innerHTML=`${sicon('check')}Salvando…`;
  try{const ok=await modalSave();if(ok!==false){draftClear();closeModal();render();}}
  catch(e){toast(traduzErro(e.message||String(e)),1);}
  finally{if($('#modalSaveBtn')){btn.disabled=false;btn.innerHTML=`${sicon('check')}Salvar`;}}
}
async function delReg(table,id,label){
  if(!confirm(`Excluir ${label.toLowerCase()}? Esta ação não pode ser desfeita.`))return;
  try{await dbDelete(table,id);toast(label+' excluído');render();}
  catch(e){toast(traduzErro(e.message||String(e)),1);}
}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ================= INIT ================= */
(async()=>{
  const{data:{session}}=await SB.auth.getSession();
  if(session)showApp(session);else showLogin();
})();
</script>
